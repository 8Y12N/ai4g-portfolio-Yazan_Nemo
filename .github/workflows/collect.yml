name: collect
on:
  schedule:
    - cron: "7,37 * * * *"   # backup only, in case the chain ever breaks
  workflow_dispatch:

permissions:
  contents: write
  actions: write             # needed to start the next run

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: "Term 1/Week 6/hackathon"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install websocket-client
      - name: Collect every 10 min for ~5 hours
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          end=$(( $(date +%s) + 320*60 ))
          while [ $(date +%s) -lt $end ]; do
            python collect.py || echo "collect failed, retrying next round"
            git add data/
            git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing new"
            git pull --rebase && git push || echo "push failed, retrying next round"
            sleep 600
          done
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref main